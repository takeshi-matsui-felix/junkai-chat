<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>巡回チャット</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="巡回チャット">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1E3A5F">
<style>
  :root {
    --navy: #1E3A5F;
    --navy-dark: #152B47;
    --bg: #E9EDF2;
    --mine: #1E3A5F;
    --other: #FFFFFF;
    --alert: #E8590C;
    --text: #1B2430;
    --sub: #6B7785;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-text-size-adjust: 100%;
  }
  #app { display: flex; flex-direction: column; height: 100%; }
  header {
    background: var(--navy);
    color: #fff;
    padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 12px;
    display: flex; align-items: center; justify-content: space-between;
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 700; letter-spacing: .02em; }
  header .me {
    font-size: 12px; opacity: .85; background: none; border: 0; color: #fff; font-family: inherit;
    padding: 8px 0 8px 12px; text-decoration: underline;
  }
  #tabs { display: flex; background: var(--navy-dark); }
  #tabs button {
    flex: 1; border: 0; background: none; color: #B8C6D8; font-family: inherit; font-size: 15px; font-weight: 700;
    padding: 11px 8px; border-bottom: 3px solid transparent;
  }
  #tabs button[aria-selected="true"] { color: #fff; border-bottom-color: #fff; }
  #tabs .dot { color: #FF8A4C; font-size: 12px; margin-left: 4px; }
  #banner {
    background: #FFF3E0; color: #7A3E00; font-size: 13px; line-height: 1.6;
    padding: 10px 16px; display: none; border-bottom: 1px solid #F2D4A8;
  }
  #banner button {
    margin-top: 6px; font-size: 14px; padding: 8px 14px; border: 0; border-radius: 8px;
    background: var(--alert); color: #fff; font-weight: 700;
  }
  #list { flex: 1; overflow-y: auto; padding: 12px; -webkit-overflow-scrolling: touch; }
  .msg { max-width: 80%; margin: 0 0 10px; }
  .msg .who { font-size: 11px; color: var(--sub); margin: 0 4px 2px; }
  .msg .bubble {
    padding: 9px 12px; border-radius: 14px; font-size: 15px; line-height: 1.5;
    white-space: pre-wrap; word-break: break-word; background: var(--other);
    border-top-left-radius: 4px;
  }
  .msg .at { font-size: 10px; color: var(--sub); margin: 2px 4px 0; }
  .msg.mine { margin-left: auto; }
  .msg.mine .who, .msg.mine .at { text-align: right; }
  .msg.mine .bubble { background: var(--mine); color: #fff; border-top-left-radius: 14px; border-top-right-radius: 4px; }
  .empty { text-align: center; color: var(--sub); font-size: 13px; margin-top: 40px; }
  form#send {
    display: flex; gap: 8px; padding: 8px 10px calc(env(safe-area-inset-bottom, 0px) + 8px);
    background: #fff; border-top: 1px solid #D5DBE3;
  }
  form#send textarea {
    flex: 1; resize: none; border: 1px solid #C7CFDA; border-radius: 18px;
    padding: 9px 14px; font-size: 16px; font-family: inherit; max-height: 120px; line-height: 1.4;
  }
  form#send button {
    border: 0; background: var(--navy); color: #fff; font-weight: 700; font-size: 15px;
    border-radius: 18px; padding: 0 18px;
  }
  form#send button:disabled { opacity: .45; }
  button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 3px solid #7FB0F0; outline-offset: 2px; }

  #setup { display: none; flex: 1; padding: 28px 22px; overflow-y: auto; }
  #setup h2 { font-size: 20px; margin: 0 0 6px; }
  #setup p { font-size: 14px; color: var(--sub); line-height: 1.7; margin: 0 0 20px; }
  #setup label { display: block; font-size: 13px; font-weight: 700; margin: 14px 0 6px; }
  #setup input {
    width: 100%; font-size: 17px; padding: 12px; border: 1px solid #C7CFDA; border-radius: 10px; background: #fff;
  }
  #setup button {
    margin-top: 22px; width: 100%; font-size: 16px; font-weight: 700; padding: 14px;
    border: 0; border-radius: 10px; background: var(--navy); color: #fff;
  }
  #setup .opt {
    display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 400; margin: 8px 0 0;
    padding: 12px; border: 1px solid #C7CFDA; border-radius: 10px; background: #fff;
  }
  #setup .opt input { width: 20px; height: 20px; margin: 0; padding: 0; }
  #err { color: #C62828; font-size: 13px; margin-top: 12px; min-height: 18px; }
  #toast {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 76px);
    background: #222; color: #fff; padding: 8px 14px; border-radius: 16px; font-size: 13px; display: none;
  }
  .unread-line {
    display: flex; align-items: center; gap: 10px; margin: 6px 0 14px;
    font-size: 12px; font-weight: 700; color: #4A5B70;
  }
  .unread-line::before, .unread-line::after { content: ''; flex: 1; height: 1px; background: #B4C0CE; }
  .msg .meta { display: flex; align-items: center; gap: 8px; margin: 2px 4px 0; }
  .msg.mine .meta { justify-content: flex-end; }
  .msg .meta .at { margin: 0; }
  .readmark {
    border: 0; background: none; padding: 4px 2px; margin: -4px 0;
    font-size: 11px; font-weight: 700; color: var(--navy); font-family: inherit; text-decoration: underline;
  }
  #sheetBg {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 10;
    align-items: flex-end; justify-content: center;
  }
  #sheet {
    background: #fff; width: 100%; max-width: 520px; max-height: 60%; overflow-y: auto;
    border-radius: 16px 16px 0 0; padding: 18px 20px calc(env(safe-area-inset-bottom, 0px) + 18px);
  }
  #sheet h3 { margin: 0 0 4px; font-size: 16px; }
  #sheet .preview { font-size: 12px; color: var(--sub); margin: 0 0 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #sheet ul { list-style: none; margin: 0; padding: 0; }
  #sheet li { padding: 10px 2px; border-top: 1px solid #E3E8EE; font-size: 15px; }
  #sheet button {
    margin-top: 14px; width: 100%; font-size: 15px; font-weight: 700; padding: 12px;
    border: 0; border-radius: 10px; background: var(--navy); color: #fff;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1 id="title">巡回チャット</h1>
    <button class="me" id="me" type="button" aria-label="名前とエリアの設定を変更"></button>
  </header>
  <div id="tabs" role="tablist" aria-label="エリア切り替え" style="display:none"></div>

  <div id="banner"></div>

  <section id="setup">
    <h2>はじめに設定します</h2>
    <p>名前と合言葉は、この端末に保存されます。次回からは入力不要です。</p>
    <label for="inName">お名前（チャットに表示されます）</label>
    <input id="inName" autocomplete="off" placeholder="例：松井">
    <label for="inCode">合言葉</label>
    <input id="inCode" type="password" autocomplete="off" placeholder="管理者から聞いた合言葉">
    <label id="areaLabel">担当エリア</label>
    <div role="radiogroup" aria-labelledby="areaLabel">
      <label class="opt"><input type="radio" name="area" value="東海">東海</label>
      <label class="opt"><input type="radio" name="area" value="関東">関東</label>
      <label class="opt"><input type="radio" name="area" value="東海,関東">両方（本部など。画面上部で切り替えられます）</label>
    </div>
    <button id="btnStart" type="button">チャットを始める</button>
    <div id="err"></div>
  </section>

  <main id="list" style="display:none"></main>

  <form id="send" style="display:none">
    <textarea id="text" rows="1" placeholder="メッセージを入力"></textarea>
    <button id="btnSend" type="submit">送信</button>
  </form>
</div>
<div id="sheetBg">
  <div id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h3 id="sheetTitle"></h3>
    <p class="preview" id="sheetPreview"></p>
    <ul id="sheetList"></ul>
    <button id="sheetClose" type="button">閉じる</button>
  </div>
</div>
<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging-compat.js"></script>
<script>
// ★ここ1か所だけ、Apps ScriptのウェブアプリURLに書き換える（/exec で終わるURL）
var GAS_URL = 'https://script.google.com/macros/s/AKfycbz28hT2-1mwV-O_yRJvzAO2SD2AM1PwZ3_850ZLowWO14kokjxoKYgGaJdYUaQcTSW-/exec';

var VAPID_KEY = 'BEkNoUz_adPTWoQgkoaJXsjrs3UbTWewt0uLGaSYePMtH0FWUxjdtOSNwbSmMTLhmNz-EP9wgYWbSvrHROkjXMg';
var FIREBASE_CONFIG = {
  apiKey: 'AIzaSyAYUmDUQ-ft3hjVU7WBXyFvrMt2sXXEmoA',
  authDomain: 'junkai-chat.firebaseapp.com',
  projectId: 'junkai-chat',
  storageBucket: 'junkai-chat.firebasestorage.app',
  messagingSenderId: '592199751504',
  appId: '1:592199751504:web:d5e05642dc61610d33fe55'
};

var $ = function (id) { return document.getElementById(id); };
var store = {
  get: function (k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },
  set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
var AREAS = ['東海', '関東'];
function parseAreas(s) { return String(s || '').split(',').filter(function (a) { return AREAS.indexOf(a) !== -1; }); }
var state = {
  name: store.get('jc_name'), code: store.get('jc_code'), token: store.get('jc_token'),
  areas: parseAreas(store.get('jc_areas')), area: '', otherUnread: [],
  lastJson: '', msgs: [], readSent: '', sessionStart: true, unreadFromId: '', scrollToDivider: false
};
state.area = state.areas.indexOf(store.get('jc_area')) !== -1 ? store.get('jc_area') : (state.areas[0] || '');

function toast(msg) {
  var t = $('toast'); t.textContent = msg; t.style.display = 'block';
  setTimeout(function () { t.style.display = 'none'; }, 2500);
}

function api(action, payload) {
  var body = Object.assign({ action: action, code: state.code }, payload || {});
  return fetch(GAS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // プリフライトを避けるためtext/plainで送る
    body: JSON.stringify(body)
  }).then(function (r) { return r.json(); }).then(function (j) {
    if (!j.ok) throw new Error(j.error || '通信に失敗しました。');
    return j;
  });
}

/* ---------- 画面切り替え ---------- */
function showSetup() {
  // 設定の変更で開いた時のために、今の値を入れておく
  $('inName').value = state.name; $('inCode').value = state.code;
  var cur = state.areas.join(',');
  Array.prototype.forEach.call(document.querySelectorAll('input[name="area"]'), function (r) { r.checked = (r.value === cur); });
  $('err').textContent = '';
  $('setup').style.display = 'block';
  $('list').style.display = 'none';
  $('send').style.display = 'none';
  $('tabs').style.display = 'none';
}
function showChat() {
  $('setup').style.display = 'none';
  $('list').style.display = 'block';
  $('send').style.display = 'flex';
  $('me').textContent = state.name + '（設定）';
  $('title').textContent = state.areas.length === 1 ? '巡回チャット（' + state.area + '）' : '巡回チャット';
  renderTabs();
  refresh(true);
  updateBanner();
}
$('me').addEventListener('click', showSetup);

/* ---------- エリア（部屋）の切り替え ---------- */
function renderTabs() {
  var tabs = $('tabs');
  tabs.textContent = '';
  if (state.areas.length < 2) { tabs.style.display = 'none'; return; }
  tabs.style.display = 'flex';
  state.areas.forEach(function (a) {
    var b = document.createElement('button'); b.type = 'button'; b.setAttribute('role', 'tab');
    b.setAttribute('aria-selected', a === state.area ? 'true' : 'false');
    b.textContent = a;
    if (state.otherUnread.indexOf(a) !== -1) {
      var d = document.createElement('span'); d.className = 'dot'; d.textContent = '●';
      d.setAttribute('aria-label', '未読あり');
      b.appendChild(d);
    }
    b.addEventListener('click', function () { switchArea(a); });
    tabs.appendChild(b);
  });
}

function switchArea(a) {
  if (a === state.area) return;
  state.area = a; store.set('jc_area', a);
  state.lastJson = ''; state.msgs = []; state.readSent = '';
  state.sessionStart = true; state.unreadFromId = ''; state.scrollToDivider = false;
  var box = $('list'); box.textContent = ''; delete box.dataset.first;
  closeReaders();
  renderTabs();
  refresh();
}

$('btnStart').addEventListener('click', function () {
  var n = $('inName').value.trim(), c = $('inCode').value.trim();
  var picked = document.querySelector('input[name="area"]:checked');
  if (!n || !c) { $('err').textContent = '名前と合言葉を入力してください。'; return; }
  if (!picked) { $('err').textContent = '担当エリアを選んでください。'; return; }
  var areas = parseAreas(picked.value);
  $('err').textContent = '確認中…';
  var prev = { name: state.name, code: state.code };
  state.code = c; state.name = n;
  api('list', { name: n, area: areas[0] }).then(function () {
    store.set('jc_name', n); store.set('jc_code', c); store.set('jc_areas', areas.join(','));
    var changed = (areas.join(',') !== state.areas.join(',')) || n !== prev.name;
    state.areas = areas;
    if (areas.indexOf(state.area) === -1) { state.area = areas[0]; store.set('jc_area', state.area); }
    if (changed) { // 名前やエリアが変わったら、表示と既読の状態を作り直す
      state.lastJson = ''; state.msgs = []; state.readSent = ''; state.otherUnread = [];
      state.sessionStart = true; state.unreadFromId = ''; state.scrollToDivider = false;
      var box = $('list'); box.textContent = ''; delete box.dataset.first;
    }
    $('err').textContent = '';
    showChat();
  }).catch(function (e) {
    state.name = prev.name; state.code = prev.code;
    $('err').textContent = '入室できませんでした：' + e.message;
  });
});

/* ---------- メッセージ表示 ---------- */
function render(messages) {
  var json = JSON.stringify([messages, state.unreadFromId]);
  if (json === state.lastJson) return;
  state.lastJson = json;
  var box = $('list');
  var nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  box.textContent = '';
  if (messages.length === 0) {
    var em = document.createElement('div'); em.className = 'empty';
    em.textContent = 'まだメッセージはありません。最初の一言を送ってみましょう。';
    box.appendChild(em);
    return;
  }
  messages.forEach(function (m) {
    if (m.id === state.unreadFromId) {
      var line = document.createElement('div'); line.className = 'unread-line'; line.id = 'unreadLine';
      line.setAttribute('role', 'separator'); line.textContent = 'ここから未読メッセージ';
      box.appendChild(line);
    }
    var wrap = document.createElement('div');
    wrap.className = 'msg' + (m.name === state.name ? ' mine' : '');
    var who = document.createElement('div'); who.className = 'who'; who.textContent = m.name;
    var b = document.createElement('div'); b.className = 'bubble'; b.textContent = m.text;
    var at = document.createElement('div'); at.className = 'at'; at.textContent = m.at;
    var meta = document.createElement('div'); meta.className = 'meta';
    var n = (m.readBy || []).length;
    if (m.name === state.name && n > 0) {
      var rb = document.createElement('button'); rb.type = 'button'; rb.className = 'readmark';
      rb.textContent = '既読 ' + n;
      rb.setAttribute('aria-label', '既読 ' + n + '人。タップで名前を表示');
      rb.addEventListener('click', (function (id) { return function () { openReaders(id); }; })(m.id));
      meta.appendChild(rb);
    }
    meta.appendChild(at);
    if (m.name !== state.name) wrap.appendChild(who);
    wrap.appendChild(b); wrap.appendChild(meta);
    box.appendChild(wrap);
  });
  var ul = $('unreadLine');
  if (state.scrollToDivider && ul) {
    // 開いた直後は、未読の線が画面の上のほうに来る位置まで進める（LINEと同じ動き）
    box.scrollTop = ul.getBoundingClientRect().top - box.getBoundingClientRect().top + box.scrollTop - 8;
    state.scrollToDivider = false; box.dataset.first = '1';
  } else if (nearBottom || box.dataset.first !== '1') { box.scrollTop = box.scrollHeight; box.dataset.first = '1'; }
}

/** 開く前に自分が読んでいた位置より後ろで、最初の「他の人のメッセージ」を返す（初回入室や未読なしは空） */
function findUnread(messages, myLast) {
  if (!myLast) return '';
  var pos = -1, i;
  for (i = 0; i < messages.length; i++) { if (messages[i].id === myLast) { pos = i; break; } }
  for (i = pos + 1; i < messages.length; i++) { if (messages[i].name !== state.name) return messages[i].id; }
  return '';
}

function refresh() {
  if (!state.name || !state.code || document.visibilityState !== 'visible') return;
  var area = state.area;
  api('list', { name: state.name, area: area, areas: state.areas }).then(function (j) {
    if (area !== state.area) return; // 通信中に部屋を切り替えた場合は、古い部屋の結果を捨てる
    state.msgs = j.messages;
    var ou = (j.unreadAreas || []).join(',');
    if (ou !== state.otherUnread.join(',')) { state.otherUnread = j.unreadAreas || []; renderTabs(); }
    // 開いた直後の1回だけ、既読位置（markReadで進める前の値）から未読の線の位置を決める
    if (state.sessionStart) {
      state.sessionStart = false;
      state.unreadFromId = findUnread(j.messages, j.myLast);
      state.scrollToDivider = !!state.unreadFromId;
    }
    render(j.messages);
    markRead(j.messages);
  }).catch(function () {});
}

/* ---------- 既読 ---------- */
// 画面を見ている間、最新メッセージまで読んだことをサーバーに1回だけ伝える（新着があった時だけ再送）
function markRead(messages) {
  if (!messages.length) return;
  var lastId = messages[messages.length - 1].id;
  if (state.readSent === lastId) return;
  state.readSent = lastId;
  api('read', { name: state.name, area: state.area, lastId: lastId }).catch(function () { state.readSent = ''; });
}

function openReaders(id) {
  var m = null;
  for (var i = 0; i < state.msgs.length; i++) { if (state.msgs[i].id === id) { m = state.msgs[i]; break; } }
  if (!m) return;
  var names = m.readBy || [];
  $('sheetTitle').textContent = '既読 ' + names.length + '人';
  $('sheetPreview').textContent = m.text;
  var ul = $('sheetList'); ul.textContent = '';
  names.forEach(function (nm) { var li = document.createElement('li'); li.textContent = nm; ul.appendChild(li); });
  $('sheetBg').style.display = 'flex';
  $('sheetClose').focus();
}
function closeReaders() { $('sheetBg').style.display = 'none'; }
$('sheetClose').addEventListener('click', closeReaders);
$('sheetBg').addEventListener('click', function (ev) { if (ev.target === $('sheetBg')) closeReaders(); });
document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') closeReaders(); });
setInterval(refresh, 5000);

/* ---------- 送信 ---------- */
var ta = $('text');
ta.addEventListener('input', function () {
  ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 120) + 'px';
});
$('send').addEventListener('submit', function (ev) {
  ev.preventDefault();
  var text = ta.value.trim();
  if (!text) return;
  $('btnSend').disabled = true;
  api('send', { name: state.name, text: text, token: state.token, area: state.area }).then(function () {
    ta.value = ''; ta.style.height = 'auto';
    refresh();
  }).catch(function (e) {
    toast('送信できませんでした：' + e.message);
  }).then(function () { $('btnSend').disabled = false; });
});

/* ---------- 通知 ---------- */
function isStandalone() {
  return window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
}

function updateBanner() {
  var b = $('banner');
  b.style.display = 'none'; b.textContent = '';
  if (!('Notification' in window) || !('serviceWorker' in navigator)) {
    if (!isStandalone()) {
      b.textContent = '通知を受け取るには、Safariの共有ボタンから「ホーム画面に追加」して、追加したアイコンから開いてください。';
      b.style.display = 'block';
    }
    return;
  }
  if (Notification.permission === 'granted') { enablePush(true); return; }
  if (Notification.permission === 'denied') {
    b.textContent = '通知がオフになっています。iPhoneの「設定」→「通知」→「巡回チャット」でオンにしてください。';
    b.style.display = 'block';
    return;
  }
  b.textContent = '新着メッセージを通知で受け取れます。';
  b.appendChild(document.createElement('br'));
  var btn = document.createElement('button'); btn.type = 'button'; btn.textContent = '通知をオンにする';
  btn.addEventListener('click', function () { enablePush(false); });
  b.appendChild(btn);
  b.style.display = 'block';
}

function enablePush(silent) {
  if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG); // 設定変更で複数回呼ばれても二重初期化しない
  var messaging = firebase.messaging();
  var p = (Notification.permission === 'granted') ? Promise.resolve('granted') : Notification.requestPermission();
  return p.then(function (perm) {
    if (perm !== 'granted') { updateBanner(); return; }
    return navigator.serviceWorker.register('firebase-messaging-sw.js').then(function (reg) {
      return navigator.serviceWorker.ready.then(function () {
        return messaging.getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: reg });
      });
    }).then(function (token) {
      if (!token) throw new Error('通知トークンを取得できませんでした。');
      state.token = token; store.set('jc_token', token);
      return api('register', { name: state.name, token: token, areas: state.areas });
    }).then(function () {
      $('banner').style.display = 'none';
      if (!silent) toast('通知をオンにしました');
    });
  }).catch(function (e) {
    var b = $('banner');
    b.textContent = '通知の設定に失敗しました：' + e.message + '（ホーム画面に追加したアイコンから開いているか確認してください）';
    b.style.display = 'block';
  });
}

/* ---------- バッジ・通知のクリア ---------- */
function clearBadge() {
  try { if (navigator.clearAppBadge) navigator.clearAppBadge(); } catch (e) {}
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistration().then(function (reg) {
      if (!reg) return;
      reg.getNotifications().then(function (list) { list.forEach(function (n) { n.close(); }); });
    }).catch(function () {});
  }
}
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible') { clearBadge(); refresh(); }
  else { state.sessionStart = true; state.unreadFromId = ''; } // 閉じたら線は消え、次に開いた時に引き直す
});

/* ---------- 起動 ---------- */
// エリア機能の追加前から使っている端末は、エリア未設定なので設定画面から始める
if (state.name && state.code && state.areas.length) { showChat(); clearBadge(); } else { showSetup(); }
</script>
